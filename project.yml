name: CodexWatch

options:
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    watchOS: "10.0"
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

targets:
  CodexWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    configFiles:
      Debug: macos/CodexWatch/Config/Debug.xcconfig
      Release: macos/CodexWatch/Config/Release.xcconfig
    sources:
      - path: watchos/CodexWatch
      - path: macos/CodexWatch/Resources
        buildPhase: resources
    info:
      path: macos/CodexWatch/Support/Info.plist
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: $(MARKETING_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Codex Watch
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: 4
    scheme:
      testTargets: []
      gatherCoverageData: false

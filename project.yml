name: CodexWatch

options:
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    watchOS: "10.0"
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

targets:
  CodexWatch:
    type: application
    platform: iOS
    configFiles:
      Debug: macos/CodexWatch/Config/Debug.xcconfig
      Release: macos/CodexWatch/Config/Release.xcconfig
    info:
      path: macos/CodexWatch/Support/Info.plist
      properties:
        CFBundleDisplayName: Codex Watch
        CFBundlePackageType: APPL
        CODEX_WATCH_AUDIO_UPLOAD_PASSWORD: $(CODEX_WATCH_AUDIO_UPLOAD_PASSWORD)
        CODEX_WATCH_AUDIO_UPLOAD_URL: $(CODEX_WATCH_AUDIO_UPLOAD_URL)
        CODEX_WATCH_AUDIO_UPLOAD_USERNAME: $(CODEX_WATCH_AUDIO_UPLOAD_USERNAME)
        NSMicrophoneUsageDescription: Codex Watch uses the microphone to record audio for your private local transcription workflow.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: ios/CodexWatch
    resources:
      - path: ios/CodexWatch/Assets.xcassets
      - path: macos/CodexWatch/Resources/watch-audio-ca.crt
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: $(MARKETING_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Codex Watch
        SKIP_INSTALL: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: CodexWatch Watch App
    scheme:
      testTargets: []
      gatherCoverageData: false

  CodexWatch Watch App:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    configFiles:
      Debug: macos/CodexWatch/Config/WatchApp-Debug.xcconfig
      Release: macos/CodexWatch/Config/WatchApp-Release.xcconfig
    sources:
      - path: macos/CodexWatch/Resources/Assets.xcassets
    info:
      path: macos/CodexWatch/Support/WatchApp-Info.plist
      properties:
        CFBundleDisplayName: Codex Watch
        CFBundleIconFiles:
          - AppIcon
        WKCompanionAppBundleIdentifier: com.zachwyatt.codexwatch
        WKWatchKitApp: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_WKWatchKitApp: YES
        MARKETING_VERSION: $(MARKETING_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: com.zachwyatt.codexwatch.watchkitapp
        PRODUCT_NAME: Codex Watch
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 4
    dependencies:
      - target: CodexWatch Watch Extension

  CodexWatch Watch Extension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "10.0"
    configFiles:
      Debug: macos/CodexWatch/Config/WatchExtension-Debug.xcconfig
      Release: macos/CodexWatch/Config/WatchExtension-Release.xcconfig
    sources:
      - path: watchos/CodexWatch
    info:
      path: macos/CodexWatch/Support/WatchExtension-Info.plist
      properties:
        CFBundleDisplayName: Codex Watch Extension
        CODEX_WATCH_RELAY_BASE_URL: $(CODEX_WATCH_RELAY_BASE_URL)
        CODEX_WATCH_RELAY_TOKEN: $(CODEX_WATCH_RELAY_TOKEN)
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: com.zachwyatt.codexwatch.watchkitapp
          NSExtensionPointIdentifier: com.apple.watchkit
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Codex Watch uses the microphone to record audio for your private local transcription workflow.
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: $(MARKETING_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: com.zachwyatt.codexwatch.watchkitapp.watchkitextension
        PRODUCT_NAME: Codex Watch Extension
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 4
        INFOPLIST_KEY_WKAppBundleIdentifier: com.zachwyatt.codexwatch.watchkitapp
        WK_APP_BUNDLE_IDENTIFIER: com.zachwyatt.codexwatch.watchkitapp

name: Verify Scribe Pilot phone and Watch
on:
  workflow_dispatch:
  push:
    branches: [feature/gunmetal-red-openai, feature/shared-ai-workspace, feature/complete-recordings, fix/workspace-recovery, feature/watch-voice-assistants]
    paths: ['ios/**', 'watchos/**', 'shared/**', 'native-tests/**', 'native-ui-tests/**', 'server_workspace/**', 'project.yml']
jobs:
  native:
    runs-on: macos-26-intel
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify workspace isolation and durable jobs
        run: |
          python3 -m venv .workspace-test
          .workspace-test/bin/pip install -r server_workspace/requirements.txt pytest
          .workspace-test/bin/python -m pytest server_workspace/tests -q
      - name: Generate native project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build phone and Watch and run queue tests
        run: |
          set -o pipefail
          PHONE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          echo "$PHONE_ID" > phone-simulator.txt
          xcrun simctl boot "$PHONE_ID" || true
          xcrun simctl bootstatus "$PHONE_ID" -b
          xcodebuild test -project CodexWatch.xcodeproj -scheme CodexWatch -configuration Debug -destination "platform=iOS Simulator,id=$PHONE_ID" -parallel-testing-enabled NO -derivedDataPath DerivedData -resultBundlePath native-results.xcresult CODE_SIGNING_ALLOWED=NO | tee native-build.log
      - name: Capture Watch preview
        if: always()
        run: |
          set -euo pipefail
          PHONE_ID=$(cat phone-simulator.txt)
          WATCH_APP="DerivedData/Build/Products/Debug-watchsimulator/Scribe Pilot.app"
          if [ ! -d "$WATCH_APP" ]; then
            echo "Watch app was not built; preview unavailable."
            exit 0
          fi
          WATCH_EXTENSION=$(find "$WATCH_APP" -type d -name '*.appex' -print -quit)
          python3 scripts/verify_watch_voice_metadata.py "$WATCH_EXTENSION/Metadata.appintents"
          WATCH_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((v["udid"] for k,vs in d["devices"].items() if "watchOS" in k for v in vs if "Apple Watch" in v["name"]), ""))')
          mkdir -p native-screenshots
          if [ -n "$WATCH_ID" ]; then
            xcrun simctl pair "$WATCH_ID" "$PHONE_ID" || true
            xcrun simctl boot "$WATCH_ID" || true
            xcrun simctl bootstatus "$WATCH_ID" -b
            xcrun simctl install "$WATCH_ID" "$WATCH_APP"
            xcrun simctl launch "$WATCH_ID" com.zachwyatt.codexwatch.watchkitapp -scribe-ui-preview
            sleep 5
            xcrun simctl io "$WATCH_ID" screenshot native-screenshots/watch-capture.png
            xcrun simctl terminate "$WATCH_ID" com.zachwyatt.codexwatch.watchkitapp || true
            xcrun simctl launch "$WATCH_ID" com.zachwyatt.codexwatch.watchkitapp -scribe-ui-preview -scribe-watch-queue
            sleep 5
            xcrun simctl io "$WATCH_ID" screenshot native-screenshots/watch-queue.png
            xcrun simctl terminate "$WATCH_ID" com.zachwyatt.codexwatch.watchkitapp || true
            xcrun simctl launch "$WATCH_ID" com.zachwyatt.codexwatch.watchkitapp -scribe-ui-preview -scribe-watch-settings
            sleep 5
            xcrun simctl io "$WATCH_ID" screenshot native-screenshots/watch-settings.png
            xcrun simctl terminate "$WATCH_ID" com.zachwyatt.codexwatch.watchkitapp || true
            xcrun simctl launch "$WATCH_ID" com.zachwyatt.codexwatch.watchkitapp -scribe-ui-preview -scribe-watch-voice
            sleep 5
            xcrun simctl io "$WATCH_ID" screenshot native-screenshots/watch-voice.png
          fi
      - name: Export UI screenshots
        if: always()
        run: |
          mkdir -p native-screenshots
          if [ -d native-results.xcresult ]; then
            xcrun xcresulttool export attachments --path native-results.xcresult --output-path native-screenshots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scribe-native-verification
          path: |
            native-build.log
            native-results.xcresult
            native-screenshots
            DerivedData/Build/Products/Debug-iphonesimulator/*.app
            DerivedData/Build/Products/Debug-watchsimulator/*.app

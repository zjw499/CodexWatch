name: Build watchOS and upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Check an existing TestFlight build without creating a new archive
        required: false
        default: "false"
      build_number:
        description: Existing build number to check when check_only is true
        required: false
        default: "49"
      diagnose_only:
        description: Print the App Store Connect app and latest visible builds without polling
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: watchos-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    if: ${{ inputs.check_only != 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.zachwyatt.codexwatch
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_NAME: CodexWatch App Store
      WATCH_APP_PROFILE_NAME: CodexWatch Watch App Store
      WATCH_EXTENSION_PROFILE_NAME: CodexWatch Watch Extension Store
      WATCH_AUDIO_UPLOAD_URL: ${{ secrets.WATCH_AUDIO_UPLOAD_URL }}
      WATCH_AUDIO_BASIC_AUTH_USERNAME: ${{ secrets.WATCH_AUDIO_BASIC_AUTH_USERNAME }}
      WATCH_AUDIO_BASIC_AUTH_PASSWORD: ${{ secrets.WATCH_AUDIO_BASIC_AUTH_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_WATCH_APP_PROFILE_BASE64: ${{ secrets.APPLE_WATCH_APP_PROFILE_BASE64 }}
          APPLE_WATCH_EXTENSION_PROFILE_BASE64: ${{ secrets.APPLE_WATCH_EXTENSION_PROFILE_BASE64 }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_PROVISIONING_PROFILE_BASE64 \
            APPLE_WATCH_APP_PROFILE_BASE64 \
            APPLE_WATCH_EXTENSION_PROFILE_BASE64 \
            APPSTORE_ISSUER_ID \
            APPSTORE_KEY_ID \
            APPSTORE_PRIVATE_KEY \
            KEYCHAIN_PASSWORD \
            WATCH_AUDIO_UPLOAD_URL \
            WATCH_AUDIO_BASIC_AUTH_USERNAME \
            WATCH_AUDIO_BASIC_AUTH_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.4.1.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          elif [[ -d /Applications/Xcode_26.4.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          elif [[ -d /Applications/Xcode_26.2.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          elif [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Install signing assets
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_WATCH_APP_PROFILE_BASE64: ${{ secrets.APPLE_WATCH_APP_PROFILE_BASE64 }}
          APPLE_WATCH_EXTENSION_PROFILE_BASE64: ${{ secrets.APPLE_WATCH_EXTENSION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codexwatch-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            local profile_name="$1"
            local profile_base64="$2"
            local profile_path="$RUNNER_TEMP/${profile_name// /_}.mobileprovision"
            local profile_plist="$RUNNER_TEMP/${profile_name// /_}.plist"
            printf '%s' "$profile_base64" | base64 --decode > "$profile_path"
            security cms -D -i "$profile_path" > "$profile_plist"
            local profile_uuid
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
            cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          }

          install_profile "$PROFILE_NAME" "$APPLE_PROVISIONING_PROFILE_BASE64"
          install_profile "$WATCH_APP_PROFILE_NAME" "$APPLE_WATCH_APP_PROFILE_BASE64"
          install_profile "$WATCH_EXTENSION_PROFILE_NAME" "$APPLE_WATCH_EXTENSION_PROFILE_BASE64"

      - name: Install App Store Connect API key
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$API_KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$API_KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate

      - name: Set unique archive build number
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/g" CodexWatch.xcodeproj/project.pbxproj
          printf '\nCURRENT_PROJECT_VERSION = %s\n' "$GITHUB_RUN_NUMBER" >> macos/CodexWatch/Config/Base.xcconfig
          for plist in \
            macos/CodexWatch/Support/Info.plist \
            macos/CodexWatch/Support/WatchApp-Info.plist \
            macos/CodexWatch/Support/WatchExtension-Info.plist; do
            if /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$plist"
            else
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" "$plist"
            fi
          done

      - name: Verify generated WatchKit metadata
        shell: bash
        run: |
          set -euo pipefail
          for plist in \
            macos/CodexWatch/Support/WatchApp-Info.plist \
            macos/CodexWatch/Support/WatchExtension-Info.plist; do
            echo "--- $plist ---"
            /usr/libexec/PlistBuddy -c 'Print :WKWatchKitApp' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :WKApplication' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :WKAppBundleIdentifier' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$plist" 2>/dev/null || true
          done
          background_mode="$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' macos/CodexWatch/Support/WatchExtension-Info.plist)"
          if [[ "$background_mode" != "audio" ]]; then
            echo "Watch extension must declare the audio background mode" >&2
            exit 1
          fi

      - name: Archive watchOS app
        shell: bash
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -uo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/CodexWatchDerivedData"
          set +e
          xcodebuild \
            -project CodexWatch.xcodeproj \
            -scheme CodexWatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -archivePath "$RUNNER_TEMP/CodexWatch.xcarchive" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODEX_WATCH_AUDIO_UPLOAD_URL="$WATCH_AUDIO_UPLOAD_URL" \
            CODEX_WATCH_AUDIO_UPLOAD_USERNAME="$WATCH_AUDIO_BASIC_AUTH_USERNAME" \
            CODEX_WATCH_AUDIO_UPLOAD_PASSWORD="$WATCH_AUDIO_BASIC_AUTH_PASSWORD"
          archive_status=$?
          set -e

          while IFS= read -r plist; do
            echo "--- processed $plist ---"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :WKApplication' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :WKWatchKitApp' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :WKAppBundleIdentifier' "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$plist" 2>/dev/null || true
          done < <(find "$DERIVED_DATA_PATH" -type f -name Info.plist -print)

          exit "$archive_status"

      - name: Verify iPhone upload resources
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/CodexWatch.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          CA_PATH="$(find "$APP_PATH" -type f -name 'watch-audio-ca.crt' -print -quit)"
          test -n "$CA_PATH"
          echo "iPhone upload CA found at app-relative path: ${CA_PATH#"$APP_PATH/"}"
          for key in \
            CODEX_WATCH_AUDIO_UPLOAD_URL \
            CODEX_WATCH_AUDIO_UPLOAD_USERNAME \
            CODEX_WATCH_AUDIO_UPLOAD_PASSWORD; do
            if ! /usr/libexec/PlistBuddy -c "Print :$key" "$APP_PATH/Info.plist" >/dev/null; then
              echo "Missing required iPhone configuration key: $key"
              exit 1
            fi
          done
          encryption_value="$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP_PATH/Info.plist")"
          if [[ "$encryption_value" != "false" ]]; then
            echo "ITSAppUsesNonExemptEncryption must be false in the archived iPhone app"
            exit 1
          fi
          echo "iPhone upload certificate and configuration keys are present"

      - name: Upload archive to TestFlight
        shell: bash
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zachwyatt.codexwatch</key>
              <string>${PROFILE_NAME}</string>
              <key>com.zachwyatt.codexwatch.watchkitapp</key>
              <string>${WATCH_APP_PROFILE_NAME}</string>
              <key>com.zachwyatt.codexwatch.watchkitapp.watchkitextension</key>
              <string>${WATCH_EXTENSION_PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/CodexWatch.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

  check-testflight-build:
    if: ${{ inputs.check_only == 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      APP_ID: "6789821399"
      BUILD_NUMBER: ${{ inputs.build_number }}
      DIAGNOSE_ONLY: ${{ inputs.diagnose_only }}
      BETA_GROUP_NAME: Personal Internal Testing
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    steps:
      - name: Check processing and internal-test access
        shell: bash
        run: |
          set -euo pipefail
          for name in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          export ASC_JWT="$(ruby <<'RUBY'
          require "base64"
          require "digest"
          require "json"
          require "openssl"

          def encode(value)
            Base64.urlsafe_encode64(value, padding: false)
          end

          header = encode({ alg: "ES256", kid: ENV.fetch("APPSTORE_KEY_ID"), typ: "JWT" }.to_json)
          now = Time.now.to_i
          payload = encode({ iss: ENV.fetch("APPSTORE_ISSUER_ID"), iat: now, exp: now + 900, aud: "appstoreconnect-v1" }.to_json)
          unsigned = "#{header}.#{payload}"
          key = OpenSSL::PKey::EC.new(ENV.fetch("APPSTORE_PRIVATE_KEY"))
          der = key.dsa_sign_asn1(Digest::SHA256.digest(unsigned))
          values = OpenSSL::ASN1.decode(der).value
          r = [values[0].value.to_i.to_s(16).rjust(64, "0")].pack("H*")
          s = [values[1].value.to_i.to_s(16).rjust(64, "0")].pack("H*")
          puts "#{unsigned}.#{encode(r + s)}"
          RUBY
          )"

          api="https://api.appstoreconnect.apple.com/v1"
          auth=(-H "Authorization: Bearer $ASC_JWT")
          if [[ "$DIAGNOSE_ONLY" == "true" ]]; then
            app_json="$(curl -fsSL "${auth[@]}" "$api/apps/$APP_ID")"
            echo "$app_json" | jq -c '{id: .data.id, name: .data.attributes.name, bundleId: .data.attributes.bundleId}'
            all_builds="$(curl -fsSL "${auth[@]}" -G "$api/builds" \
              --data-urlencode "sort=-uploadedDate" \
              --data-urlencode "limit=25")"
            echo "Latest visible builds:"
            echo "$all_builds" | jq -r '.data[] | [.id, .attributes.buildNumber, .attributes.version, .attributes.processingState, .attributes.uploadedDate] | @tsv'
            echo "Target build attributes:"
            echo "$all_builds" | jq -c --arg build "$BUILD_NUMBER" '
              .data[] | select((.attributes.version | tostring) == $build) | .attributes
            '
            exit 0
          fi
          processing_state=""
          for attempt in $(seq 1 20); do
            build_json="$(curl -fsSL "${auth[@]}" -G "$api/builds" \
              --data-urlencode "sort=-uploadedDate" \
              --data-urlencode "limit=50")"
            build_row="$(jq -r --arg build "$BUILD_NUMBER" '
              .data[] | select((.attributes.version | tostring) == $build) |
              [.id, .attributes.version, .attributes.processingState, (.attributes.usesNonExemptEncryption | tostring)] | @tsv
            ' <<< "$build_json" | head -n 1)"
            if [[ -n "$build_row" ]]; then
              IFS=$'\t' read -r build_id version processing_state encryption_value <<< "$build_row"
              echo "Build $BUILD_NUMBER version $version processing state: $processing_state encryption: $encryption_value"
              if [[ "$processing_state" == "VALID" && "$encryption_value" == "false" ]]; then break; fi
              if [[ "$processing_state" == "VALID" ]]; then
                echo "Build $BUILD_NUMBER is valid but export compliance is incomplete." >&2
                exit 1
              fi
              if [[ "$processing_state" == "FAILED" || "$processing_state" == "INVALID" ]]; then exit 1; fi
            else
              echo "Build $BUILD_NUMBER is not visible in App Store Connect yet."
            fi
            [[ "$attempt" -lt 20 ]] && sleep 30
          done

          if [[ "$processing_state" != "VALID" ]]; then
            echo "Build $BUILD_NUMBER did not reach VALID processing state." >&2
            exit 1
          fi

          group_ids="$(curl --fail --silent --show-error --max-time 60 "${auth[@]}" \
            "$api/apps/$APP_ID/relationships/betaGroups")"
          group_id=""
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            group_json="$(curl --fail --silent --show-error --max-time 60 "${auth[@]}" "$api/betaGroups/$candidate")"
            group_name="$(jq -r '.data.attributes.name // empty' <<< "$group_json")"
            if [[ "$group_name" == "$BETA_GROUP_NAME" ]]; then
              group_id="$candidate"
              break
            fi
          done < <(jq -r '.data[].id' <<< "$group_ids")
          [[ -n "$group_id" ]] || { echo "Internal testing group not found" >&2; exit 1; }

          assignment_response="$RUNNER_TEMP/testflight-assignment.json"
          assignment_status="$(curl --silent --show-error --max-time 60 -X POST "${auth[@]}" \
            -H "Content-Type: application/json" \
            "$api/betaGroups/$group_id/relationships/builds" \
            --data "{\"data\":[{\"type\":\"builds\",\"id\":\"$build_id\"}]}" \
            --output "$assignment_response" --write-out '%{http_code}')"
          if [[ "$assignment_status" -ge 200 && "$assignment_status" -lt 300 ]]; then
            echo "Assigned build $BUILD_NUMBER to $BETA_GROUP_NAME."
          elif [[ "$assignment_status" == "422" ]] && jq -e '
            .errors[] | select(.detail == "Cannot add internal group to a build.")
          ' "$assignment_response" >/dev/null; then
            echo "$BETA_GROUP_NAME is an all-build internal group; build $BUILD_NUMBER is available automatically."
          else
            echo "App Store Connect assignment returned HTTP $assignment_status" >&2
            jq -c '.' "$assignment_response" >&2 || cat "$assignment_response" >&2
            exit 1
          fi
